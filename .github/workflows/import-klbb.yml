name: Import KLBB v19 source files
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-klbb.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify all published static files
        env:
          KLBB_SITE_URL: https://klbb-2027-festival-playground.aviyansah.chatgpt.site
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import os
          import time
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          source = os.environ["KLBB_SITE_URL"].rstrip("/")
          records = []
          for line in Path("site-blob-manifest.tsv").read_text().splitlines():
              sha, size, path = line.split("\t", 2)
              if not path.startswith("dist/") or ".." in Path(path).parts:
                  raise ValueError(f"Unsafe path: {path}")
              records.append((sha, int(size), path))

          def download(record):
              expected_sha, expected_size, path = record
              relative = path[5:]
              url = f"{source}/{quote(relative, safe='/')}"
              error = None
              for attempt in range(4):
                  try:
                      req = Request(url, headers={
                          "User-Agent": "KLBB2027-GitHub-Migration/1.0",
                          "Accept-Encoding": "identity"
                      })
                      with urlopen(req, timeout=75) as response:
                          data = response.read()
                      if len(data) != expected_size:
                          raise ValueError(f"Size mismatch for {path}: {len(data)} != {expected_size}")
                      blob_hash = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                      if blob_hash != expected_sha:
                          raise ValueError(f"Git blob hash mismatch for {path}")
                      destination = Path(path)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(data)
                      return path
                  except Exception as exc:
                      error = exc
                      time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"Unable to import {path}: {error}")

          print(f"Importing {len(records)} files from {source}", flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for index, path in enumerate(pool.map(download, records), 1):
                  if index % 10 == 0 or index == len(records):
                      print(f"Verified {index}/{len(records)} files", flush=True)
          PY
      - name: Commit complete source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist
          if ! git diff --cached --quiet; then
            git commit -m "Import complete KLBB 2027 v19 static site"
            git push origin HEAD:main
          fi
