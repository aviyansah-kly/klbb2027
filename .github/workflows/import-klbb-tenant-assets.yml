name: Import KLBB Figma tenant logos
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-klbb-tenant-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install image decoder
        run: python3 -m pip install --quiet Pillow
      - name: Download original tenant logo assets from KLBB 2026 Figma
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import time
          from io import BytesIO
          from PIL import Image
          from pathlib import Path
          from urllib.request import Request, urlopen

          items = [line.split("|", 1) for line in "bowlle|https://www.figma.com/api/mcp/asset/9e31aaa8-442a-4c88-a2ee-62c42b501b7a/1cc25.png\nrena-foodies|https://www.figma.com/api/mcp/asset/9e31aaa8-442a-4c88-a2ee-62c42b501b7a/4b815.png\nse-indonesia|https://www.figma.com/api/mcp/asset/9e31aaa8-442a-4c88-a2ee-62c42b501b7a/7f20a.png\nnasgor-oyster-omellette-golden-kitchen|https://www.figma.com/api/mcp/asset/9165edff-9f2d-4af9-9817-386686d5b6fc/e322c.png\nbakso-rusuk-solo-39|https://www.figma.com/api/mcp/asset/9165edff-9f2d-4af9-9817-386686d5b6fc/8502d.png\nayam-pak-gembus|https://www.figma.com/api/mcp/asset/9165edff-9f2d-4af9-9817-386686d5b6fc/0e8bd.png\ntebubu|https://www.figma.com/api/mcp/asset/22c412de-8f12-401e-ae46-2b5d28c38bd0/0a837.png\nbest-street-food|https://www.figma.com/api/mcp/asset/22c412de-8f12-401e-ae46-2b5d28c38bd0/d57c0.png\nlong-potatoss|https://www.figma.com/api/mcp/asset/22c412de-8f12-401e-ae46-2b5d28c38bd0/b0b5c.png\nstreet-mentai|https://www.figma.com/api/mcp/asset/22c412de-8f12-401e-ae46-2b5d28c38bd0/2adb2.png\nrice-bowl-express|https://www.figma.com/api/mcp/asset/4a9094c1-84f1-47ab-a8d0-256c286f9d6a/6b7d0.png\nlawson|https://www.figma.com/api/mcp/asset/4a9094c1-84f1-47ab-a8d0-256c286f9d6a/d3eeb.png\npisang-madu-pasti|https://www.figma.com/api/mcp/asset/4a9094c1-84f1-47ab-a8d0-256c286f9d6a/559fb.png\nshlurp-drink|https://www.figma.com/api/mcp/asset/4a9094c1-84f1-47ab-a8d0-256c286f9d6a/f066e.png\nburger-bangor|https://www.figma.com/api/mcp/asset/c1fa3b22-14f6-4c2f-a78e-bcfa984833fa/d2ff8.png\npizza-ranjang|https://www.figma.com/api/mcp/asset/c1fa3b22-14f6-4c2f-a78e-bcfa984833fa/3d72d.png\nhokben|https://www.figma.com/api/mcp/asset/c1fa3b22-14f6-4c2f-a78e-bcfa984833fa/7a0ea.png\nshihlin-taiwan-street-snacks|https://www.figma.com/api/mcp/asset/c1fa3b22-14f6-4c2f-a78e-bcfa984833fa/c8828.png\nchatime|https://www.figma.com/api/mcp/asset/185203b8-0481-4efc-baef-8862ae376ab1/9c6a4.png\nsteak-house-indonesia|https://www.figma.com/api/mcp/asset/185203b8-0481-4efc-baef-8862ae376ab1/574cf.png\nteppanyaki|https://www.figma.com/api/mcp/asset/185203b8-0481-4efc-baef-8862ae376ab1/2dd04.png\nsweet-drink|https://www.figma.com/api/mcp/asset/185203b8-0481-4efc-baef-8862ae376ab1/60293.png\ncheese-party|https://www.figma.com/api/mcp/asset/efded0ec-1a8c-4667-92fa-5281cc5819a6/2a77d.png\nhotdog-king|https://www.figma.com/api/mcp/asset/efded0ec-1a8c-4667-92fa-5281cc5819a6/00d9c.png\npentol-kriwill-39|https://www.figma.com/api/mcp/asset/efded0ec-1a8c-4667-92fa-5281cc5819a6/5e5f5.png\njagiya-korean-food|https://www.figma.com/api/mcp/asset/efded0ec-1a8c-4667-92fa-5281cc5819a6/f889b.png\ncheeseking|https://www.figma.com/api/mcp/asset/94abb6c4-a403-4bd5-87db-c7ec95f68c34/8e781.png\nbig-bite-cuanki|https://www.figma.com/api/mcp/asset/94abb6c4-a403-4bd5-87db-c7ec95f68c34/1b936.png\nmujigae|https://www.figma.com/api/mcp/asset/94abb6c4-a403-4bd5-87db-c7ec95f68c34/d08a9.png\njatinangorhouse|https://www.figma.com/api/mcp/asset/e74d309f-5b06-4da7-a4e5-2a266c0949cd/a758a.png\njatinangor|https://www.figma.com/api/mcp/asset/e74d309f-5b06-4da7-a4e5-2a266c0949cd/0cb34.png\nsteak-go|https://www.figma.com/api/mcp/asset/e74d309f-5b06-4da7-a4e5-2a266c0949cd/66931.png\nchiclin-taiwan-crispy-chicken|https://www.figma.com/api/mcp/asset/e74d309f-5b06-4da7-a4e5-2a266c0949cd/a9cc1.png\norder-jus|https://www.figma.com/api/mcp/asset/a5441912-98d4-44dd-aca9-c2d983c470be/854a8.png\nnasgor-rame-rame|https://www.figma.com/api/mcp/asset/a5441912-98d4-44dd-aca9-c2d983c470be/8813a.png\nchelsea-food-drink|https://www.figma.com/api/mcp/asset/a5441912-98d4-44dd-aca9-c2d983c470be/96e5e.png".splitlines() if line.strip()]
          target = Path("dist/assets/tenants")
          target.mkdir(parents=True, exist_ok=True)

          def download(item):
              slug, url = item
              path = target / f"{slug}.png"
              if path.exists() and path.stat().st_size > 500:
                  return slug
              error = None
              for attempt in range(4):
                  try:
                      req = Request(url, headers={"User-Agent": "Mozilla/5.0 KLBB-2027-Design-Migration"})
                      with urlopen(req, timeout=60) as res:
                          data = res.read()
                      if len(data) < 500:
                          raise ValueError(f"Unexpected short response for {slug}: {len(data)} bytes")
                      with Image.open(BytesIO(data)) as img:
                          img.load()
                          if img.format not in ("PNG", "JPEG", "WEBP", "GIF"):
                              raise ValueError(f"Unsupported image format for {slug}: {img.format}")
                          img.convert("RGBA").save(path, format="PNG", optimize=True)
                      return slug
                  except Exception as exc:
                      error = exc
                      time.sleep(2 * (attempt + 1))
              raise RuntimeError(f"Logo download failed: {slug}: {error}")

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for done in pool.map(download, items):
                  print("Imported:", done, flush=True)
          print(f"Verified {len(items)} PNG logo assets", flush=True)
          PY
      - name: Commit tenant assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/tenants
          if ! git diff --cached --quiet; then
            git commit -m "Import original KLBB tenant logo assets from Figma"
            git push origin HEAD:main
          fi
