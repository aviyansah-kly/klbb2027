name: Optimize KLBB tenant logos
on:
  push:
    paths:
      - ".github/workflows/optimize-klbb-tenant-assets.yml"
      - "dist/assets/tenants/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Resize and optimize original tenant logos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path("dist/assets/tenants").glob("*.png"))
          assert len(files) >= 36, f"Expected 36 tenant logos, got {len(files)}"
          before = sum(path.stat().st_size for path in files)
          for path in files:
              with Image.open(path) as image:
                  image.load()
                  image.thumbnail((520, 520), Image.Resampling.LANCZOS)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA")
                  if image.mode == "RGBA" and image.getchannel("A").getextrema() == (255, 255):
                      image = image.convert("RGB")
                  image.save(path, "PNG", optimize=True, compress_level=9)
          after = sum(path.stat().st_size for path in files)
          print(f"Optimized {len(files)} tenant logos: {before/1048576:.2f} MB -> {after/1048576:.2f} MB")
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/tenants
          if git diff --cached --quiet; then
            echo "Tenant logos already optimized"
          else
            git commit -m "perf(food market): optimize tenant logo file sizes"
            git push
          fi
